ase 2: Exploración, Prototipado y Colaboración","momento":"HACER","dimension":"03. Colaboración y cocreación","capacidad":"Cap. 3.2: Gestión de divergencias","insignia":"Articulador de Alianzas","puntoCiego":"Defensa de la voz ciudadana","pregunta":"Cuando surge una discrepancia entre lo que solicita la directiva de la entidad y las demandas expresadas por los usuarios de base en el territorio, ¿cuál es la postura de su equipo?","opciones":[{"letra":"A","texto":"Convocar un comité técnico formal para mapear los requerimientos directivos frente al pliego contractual y las restricciones presupuestales.","arquetipo":"Proveedor Tecnológico de Escala","rol":"Conciliador institucional"},{"letra":"B","texto":"Presentar la evidencia viva y los testimonios de campo de forma asertiva para argumentar por qué el diseño debe responder al dolor ciudadano.","arquetipo":"Solucionador GovTech","rol":"Defensor de la voz ciudadana"},{"letra":"C","texto":"Elaborar un informe técnico independiente que exponga los pros, contras y riesgos de cada alternativa para facilitar una decisión informada.","arquetipo":"Aliado Especializado","rol":"Asesor técnico objetivo"},{"letra":"D","texto":"Proponer el diseño de dos alternativas funcionales ligeras para que una prueba rápida con usuarios permita resolver la divergencia con hechos.","arquetipo":"Potencial GovTech","rol":"Mediador mediante prototipos"}]},{"id":"P0.1","fase":"Fase 3: Capacidad Técnica y Confianza","momento":"TENER","dimension":"07. Capacidad de entrega","capacidad":"Cap. 0.1: Modelo de oferta y producto","insignia":"Relación por revisar","puntoCiego":"-","pregunta":"Cuando una entidad pública acude a su organización buscando modernizar un servicio, ¿cuál es el producto principal que ustedes ponen a disposición?","opciones":[{"letra":"A","texto":"Una solución empaquetada, probada y lista para implementar (off-the-shelf o SaaS propietario), con alcances técnicos y garantías industriales cerradas desde el primer día.","arquetipo":"Proveedor Tecnológico de Escala","rol":"Operador de certeza y catálogo"},{"letra":"B","texto":"Una capacidad de desarrollo ágil e iterativo para construir, adaptar y pilotar una solución tecnológica a la medida del dolor y contexto de esa entidad.","arquetipo":"Solucionador GovTech","rol":"Co-creador adaptativo de innovación"},{"letra":"C","texto":"Un componente tecnológico especializado (algoritmo específico, módulo de ciberseguridad, analítica avanzada) o un estudio técnico que complementa una solución mayor.","arquetipo":"Aliado Especializado","rol":"Habilitador de nicho técnico e I+D"},{"letra":"D","texto":"Una herramienta o desarrollo emergente de base tecnológica que busca su primera oportunidad para probar su aplicabilidad en un reto de ciudad.","arquetipo":"Potencial GovTech","rol":"Pionero tecnológico en exploración"}]},{"id":"P7","fase":"Fase 3: Capacidad Técnica y Entrega","momento":"TENER","dimension":"04. Solidez tecnológica","capacidad":"Cap. 4.1: Integración e interoperabilidad","insignia":"Estratega de Tecnología Responsable","puntoCiego":"PUNTO CIEGO 1: Interoperabilidad con Legacy Systems / Middleware","pregunta":"Cuando su solución debe operar con bases de datos fragmentadas o sistemas informáticos heredados (legacy systems) de la entidad pública, ¿cuál es su enfoque de integración técnica?","opciones":[{"letra":"A","texto":"Exigimos la parametrización de conectores estandarizados de grado corporativo o recomendamos migrar los datos a nuestra infraestructura certificada en la nube.","arquetipo":"Proveedor Tecnológico de Escala","rol":"Operador de infraestructura masiva estandarizada"},{"letra":"B","texto":"Desplegamos capas intermedias (middleware) modulares y APIs seguras que extraen y sincronizan datos sin requerir que la entidad modifique o sustituya sus servidores centrales.","arquetipo":"Solucionador GovTech","rol":"Integrador pragmático sobre sistemas heredados"},{"letra":"C","texto":"Desarrollamos scripts y conectores específicos a medida para enlazar nuestro componente analítico con las bases heredadas de la entidad previa auditoría técnica.","arquetipo":"Aliado Especializado","rol":"Especialista de conexión técnica de nicho"},{"letra":"D","texto":"Diseñamos mecanismos sencillos de importación/exportación periódica de datos estructurados para operar de forma desacoplada sin generar traumatismos técnicos.","arquetipo":"Potencial GovTech","rol":"Conector ligero de datos"}]},{"id":"P8","fase":"Fase 3: Capacidad Técnica y Entrega","momento":"TENER","dimension":"04. Solidez tecnológica","capacidad":"Cap. 4.2: Rigor de ingeniería y código auditable","insignia":"Estratega de Tecnología Responsable","puntoCiego":"PUNTO CIEGO 2: Rigor de Ingeniería vs. Prototipos No-Code / Wrappers IA","pregunta":"Frente al auge de herramientas automáticas (wrappers de IA y plataformas no-code), ¿cómo demuestra su equipo que su tecnología cuenta con solidez de ingeniería y no es un prototipo superficial?","opciones":[{"letra":"A","texto":"Respaldamos nuestra tecnología en plataformas industriales licenciadas con soporte de clase mundial, acuerdos de servicio blindados y certificaciones ISO de desarrollo.","arquetipo":"Proveedor Tecnológico de Escala","rol":"Proveedor de ingeniería industrial garantizada"},{"letra":"B","texto":"Disponemos de repositorio de código propio con trazabilidad (commits), arquitectura documentada, pruebas automatizadas y gobierno estricto sobre el ciclo de vida del software.","arquetipo":"Solucionador GovTech","rol":"Constructor de software auditable"},{"letra":"C","texto":"Documentamos con rigor científico los modelos algorítmicos, las fuentes de entrenamiento y los límites de precisión técnica de nuestro componente especializado.","arquetipo":"Aliado Especializado","rol":"Auditor de precisión técnica y algorítmica"},{"letra":"D","texto":"Mostramos una interfaz funcional y probada que resuelve con éxito el flujo de interacción, respaldada por un equipo que puede ajustar el código ante fallos de uso.","arquetipo":"Potencial GovTech","rol":"Desarrollador práctico de producto"}]},{"id":"P9","fase":"Fase 3: Capacidad Técnica y Entrega","momento":"TENER","dimension":"05. Confianza responsable","capacidad":"Cap. 5.1: Seguridad, privacidad y Habeas Data","insignia":"Estratega de Tecnología Responsable","puntoCiego":"Ciberseguridad y Habeas Data estatal","pregunta":"Respecto al tratamiento de datos personales de la ciudadanía y la gobernanza de la información pública, ¿cuál es la práctica de su organización?","opciones":[{"letra":"A","texto":"Implementar controles formales de seguridad de la información (cifrado avanzado, trazabilidad de logs inmutables y cumplimiento estricto del régimen de datos).","arquetipo":"Proveedor Tecnológico de Escala","rol":"Oficial de ciberseguridad y gobernanza"},{"letra":"B","texto":"Explicar en lenguaje transparente y accesible qué datos se recolectan y para qué fines, facilitando la auditoría social y el control ciudadano sobre el código.","arquetipo":"Solucionador GovTech","rol":"Custodio de la confianza cívica"},{"letra":"C","texto":"Aplicar protocolos especializados de anonimización de datos y revisión de sesgos en algoritmos para salvaguardar la neutralidad del sistema.","arquetipo":"Aliado Especializado","rol":"Auditor ético de datos"},{"letra":"D","texto":"Adoptar una política estricta de minimización: capturar exclusivamente los datos indispensables para que el servicio opere, evitando almacenar información sensible.","arquetipo":"Potencial GovTech","rol":"Protector de la intimidad por diseño"}]},{"id":"P10","fase":"Fase 3: Capacidad Técnica y Entrega","momento":"TENER","dimension":"05. Confianza responsable","capacidad":"Cap. 5.2: Soberanía, licencias y acuerdos de salida","insignia":"Estratega de Tecnología Responsable","puntoCiego":"PUNTO CIEGO 3: Reversibilidad y Costo Cero de Transición (Cero Lock-in)","pregunta":"Si la administración pública resuelve terminar la relación comercial con su empresa, ¿qué condiciones contractuales y técnicas rigen la salida del servicio?","opciones":[{"letra":"A","texto":"El código y la infraestructura permanecen como propiedad exclusiva de nuestra empresa, pero entregamos la totalidad de las bases de datos exportadas según el acuerdo de servicio.","arquetipo":"Proveedor Tecnológico de Escala","rol":"Custodio de propiedad intelectual corporativa"},{"letra":"B","texto":"Garantizamos un costo de salida estipulado cercano a cero, entregando los datos en formatos abiertos universales y facilitando la migración del código sin penalidades técnicas.","arquetipo":"Solucionador GovTech","rol":"Garante de soberanía y no extractivismo"},{"letra":"C","texto":"Transferimos la titularidad de las parametrizaciones y la documentación metodológica desarrollada a medida para que otro operador pueda continuar la labor.","arquetipo":"Aliado Especializado","rol":"Facilitador de transición de conocimiento"},{"letra":"D","texto":"Ponemos a disposición de la entidad la totalidad del código y los datos generados bajo esquemas abiertos para que la administración los gestione con total autonomía.","arquetipo":"Potencial GovTech","rol":"Constructor de bienes comunes abiertos"}]},{"id":"P11","fase":"Fase 3: Capacidad Técnica y Entrega","momento":"TENER","dimension":"07. Capacidad de entrega","capacidad":"Cap. 7.1: Continuidad y soporte de misión crítica","insignia":"Capacidad de Entrega","puntoCiego":"SLAs de misión crítica","pregunta":"Para asegurar que una solución tecnológica mantenga su estabilidad operativa tras el despliegue inicial, ¿cuál es la estrategia de soporte de su organización?","opciones":[{"letra":"A","texto":"Establecer Acuerdos de Nivel de Servicio (SLA) exhaustivos, esquemas estructurados de mesa de ayuda y manuales de arquitectura y soporte técnico 24/7.","arquetipo":"Proveedor Tecnológico de Escala","rol":"Proveedor de estabilidad y predictibilidad"},{"letra":"B","texto":"Dejar habilitados canales continuos de retroalimentación de usuario y un catálogo priorizado de mejoras (backlog) para iterar la herramienta según nuevos requerimientos.","arquetipo":"Solucionador GovTech","rol":"Evolucionador continuo de producto"},{"letra":"C","texto":"Ofrecer soporte técnico de segundo y tercer nivel focalizado exclusivamente en el mantenimiento y actualización de nuestro componente tecnológico.","arquetipo":"Aliado Especializado","rol":"Especialista de soporte avanzado"},{"letra":"D","texto":"Brindar acompañamiento directo y cercano a los servidores que operan la herramienta durante las primeras semanas, respondiendo con agilidad ante cualquier duda.","arquetipo":"Potencial GovTech","rol":"Acompañante de adopción inicial"}]},{"id":"P12","fase":"Fase 3: Capacidad Técnica y Entrega","momento":"TENER","dimension":"07. Capacidad de entrega","capacidad":"Cap. 7.2: Transferencia y no atrofia del Estado","insignia":"Capacidad de Entrega","puntoCiego":"Capacidades dinámicas estatales","pregunta":"En concordancia con el principio de evitar la atrofia del sector público planteado por Mariana Mazzucato, ¿cómo transfiere su equipo capacidades a los servidores del Distrito?","opciones":[{"letra":"A","texto":"Impartir capacitaciones formales de administración del sistema y entregar manuales de operación detallados para certificar a los operadores públicos.","arquetipo":"Proveedor Tecnológico de Escala","rol":"Capacitador técnico formal"},{"letra":"B","texto":"Acompañar a los funcionarios mediante mentorías de «aprender haciendo» y entrega de código comentado, para que sean autónomos en la evolución del software.","arquetipo":"Solucionador GovTech","rol":"Fortalecedor de capacidades dinámicas del Estado"},{"letra":"C","texto":"Entrenar a los equipos técnicos del Distrito en los principios de operación y mantenimiento de nuestra tecnología especializada.","arquetipo":"Aliado Especializado","rol":"Transferidor de conocimiento experto"},{"letra":"D","texto":"Documentar paso a paso la configuración de la herramienta y realizar talleres prácticos para que los equipos públicos puedan gestionarla por sí mismos.","arquetipo":"Potencial GovTech","rol":"Habilitador de autonomía básica"}]},{"id":"P13","fase":"Fase 3: Capacidad Técnica y Entrega","momento":"TENER","dimension":"08. Riesgo e incertidumbre","capacidad":"Cap. 8.1: Protocolos ante fallos críticos","insignia":"Riesgo e Incertidumbre","puntoCiego":"Contingencia operativa ciudadana","pregunta":"Ocurre una interrupción imprevista del servicio digital en un trámite masivo de la ciudad. ¿Cuál es la primera línea de acción de su equipo técnico?","opciones":[{"letra":"A","texto":"Activar el protocolo formal de continuidad de negocio, aislar la falla en los logs de auditoría y generar el reporte circunstanciado para la supervisión.","arquetipo":"Proveedor Tecnológico de Escala","rol":"Garante de estabilidad procedimental y forense"},{"letra":"B","texto":"Desplegar una contingencia técnica de respuesta inmediata para restablecer la disponibilidad funcional en minutos, informando con transparencia a la ciudadanía.","arquetipo":"Solucionador GovTech","rol":"Resolutor operativo de choque"},{"letra":"C","texto":"Diagnosticar si el fallo se originó en nuestro componente o en un sistema externo, aplicando los parches de remediación correspondientes.","arquetipo":"Aliado Especializado","rol":"Remediador técnico especializado"},{"letra":"D","texto":"Activar de inmediato mecanismos alternativos de emergencia para que la ciudadanía pueda seguir gestionando su trámite mientras se soluciona el código.","arquetipo":"Potencial GovTech","rol":"Mitigador de impacto inmediato"}]},{"id":"P14","fase":"Fase 3: Capacidad Técnica y Entrega","momento":"TENER","dimension":"08. Riesgo e incertidumbre","capacidad":"Cap. 8.2: Adaptación a crisis y cambios de contexto","insignia":"Riesgo e Incertidumbre","puntoCiego":"Adaptabilidad regulatoria y de entorno","pregunta":"Durante la ejecución del proyecto se aprueba una nueva directriz regulatoria o sobreviene una emergencia local que altera las condiciones pactadas. ¿Cómo responde su organización?","opciones":[{"letra":"A","texto":"Revisar la matriz contractual de riesgos para calcular los impactos en plazos y costos, tramitando las modificaciones formales ante la supervisión.","arquetipo":"Proveedor Tecnológico de Escala","rol":"Administrador de equilibrio contractual"},{"letra":"B","texto":"Reajustar la planificación y los módulos de desarrollo de manera ágil para responder a la nueva realidad sin frenar el proyecto.","arquetipo":"Solucionador GovTech","rol":"Navegador adaptativo de incertidumbre"},{"letra":"C","texto":"Evaluar cómo la nueva regulación afecta los estándares técnicos de nuestra solución y proponer los ajustes requeridos para cumplir la norma.","arquetipo":"Aliado Especializado","rol":"Adaptador normativo de nicho"},{"letra":"D","texto":"Adaptar las funcionalidades de la herramienta de manera flexible para que la entidad pueda atender la contingencia sin traumatismos.","arquetipo":"Potencial GovTech","rol":"Aliado de flexibilidad institucional"}]},{"id":"P0.2","fase":"Fase 4: Conexión con lo Público","momento":"HACER","dimension":"06. Puente B2G","capacidad":"Cap. 0.2: Gestión de la incertidumbre","insignia":"Relación por revisar","puntoCiego":"-","pregunta":"Una secretaría distrital les plantea una necesidad comunitaria compleja que no tiene especificaciones técnicas cerradas. ¿Cuál es la postura inicial de su equipo?","opciones":[{"letra":"A","texto":"Solicitamos a la entidad que termine de estructurar los términos de referencia y requerimientos funcionales para cotizar una solución cerrada y auditable.","arquetipo":"Proveedor Tecnológico de Escala","rol":"Operador de requerimientos formales"},{"letra":"B","texto":"Desplegamos rápidamente un prototipo o experimento en campo con servidores y usuarios para reducir la incertidumbre paso a paso mediante datos de uso.","arquetipo":"Solucionador GovTech","rol":"Mitigador pragmático de incertidumbre"},{"letra":"C","texto":"Aportamos nuestro conocimiento experto y metodológico para investigar y calibrar la problemática, identificando qué componentes tecnológicos específicos se requieren.","arquetipo":"Aliado Especializado","rol":"Diagnosticador metodológico"},{"letra":"D","texto":"Proponemos adaptar nuestra tecnología existente para ensayar una respuesta rápida y aprender cómo interactúa la ciudadanía con ella.","arquetipo":"Potencial GovTech","rol":"Experimentador ágil emergente"}]},{"id":"P0.4","fase":"Fase 4: Conexión con lo Público","momento":"HACER","dimension":"06. Puente B2G","capacidad":"Cap. 0.4: Métrica de éxito y valor","insignia":"Relación por revisar","puntoCiego":"-","pregunta":"Al finalizar una intervención con una entidad pública, ¿qué resultado demuestra que el trabajo de su organización fue exitoso?","opciones":[{"letra":"A","texto":"La entrega a conformidad del sistema contratado, el cumplimiento de cronogramas y estándares de rendimiento, y el cobro regular del servicio.","arquetipo":"Proveedor Tecnológico de Escala","rol":"Ejecutor de cumplimiento operativo"},{"letra":"B","texto":"La transformación cualitativa en el bienestar ciudadano, la transferencia de capacidades al equipo estatal y la validación de valor público en territorio.","arquetipo":"Solucionador GovTech","rol":"Generador de valor público sustantivo"},{"letra":"C","texto":"La resolución efectiva de un cuello de botella técnico complejo y la generación de evidencia o conocimiento aplicable para el ecosistema.","arquetipo":"Aliado Especializado","rol":"Productor de conocimiento y rigor"},{"letra":"D","texto":"La validación de que nuestra tecnología funciona en el entorno público y la apertura de una hoja de ruta para continuar colaborando con la ciudad.","arquetipo":"Potencial GovTech","rol":"Validador de tracción institucional"}]},{"id":"P15","fase":"Fase 4: Conexión con lo Público","momento":"HACER","dimension":"06. Puente B2G","capacidad":"Cap. 6.1: Contratación pública y flujo financiero","insignia":"Navegante Institucional","puntoCiego":"PUNTO CIEGO 4: Músculo Financiero y Resistencia al Ciclo de Caja (PAC)","pregunta":"En la contratación distrital, los desembolsos suelen demorar entre 60 y 120 días por trámites de supervisión y programación de pagos (PAC). ¿Cómo sostiene su empresa la operación ante este desfase financiero?","opciones":[{"letra":"A","texto":"Contamos con respaldo financiero y flujo de caja planificado para absorber ciclos largos de facturación sin detener el servicio ni comprometer al equipo.","arquetipo":"Proveedor Tecnológico de Escala","rol":"Contratista solvente y preparado"},{"letra":"B","texto":"Gestionamos esquemas de compra pública ágil estructurados por hitos cortos de entrega y validación, mitigando la exposición de caja mediante acuerdos de pago escalonados.","arquetipo":"Solucionador GovTech","rol":"Gestor de contratación ágil"},{"letra":"C","texto":"Operamos en consorcio o alianza con empresas ancla que respaldan la liquidez financiera mientras aportamos nuestro componente tecnológico.","arquetipo":"Aliado Especializado","rol":"Socio tecnológico en consorcios"},{"letra":"D","texto":"Requerimos acompañamiento y orientación para acceder a figuras contractuales adaptadas a startups (como convenios de ciencia y tecnología o anticipos de pilotaje).","arquetipo":"Potencial GovTech","rol":"Pionero en formalización B2G"}]},{"id":"P16","fase":"Fase 4: Conexión con lo Público","momento":"HACER","dimension":"06. Puente B2G","capacidad":"Cap. 6.2: Sostenibilidad ante ciclo político","insignia":"Navegante Institucional","puntoCiego":"Continuidad institucional democrática","pregunta":"Durante la ejecución de una iniciativa ocurre un relevo repentino en el equipo directivo de la secretaría contratante. ¿Cuál es la estrategia de su equipo para salvaguardar la continuidad del proyecto?","opciones":[{"letra":"A","texto":"Respaldar el proceso en la trazabilidad formal de los entregables aprobados, las actas de supervisión vigentes y las obligaciones contractuales consolidadas.","arquetipo":"Proveedor Tecnológico de Escala","rol":"Defensor de la seguridad jurídica"},{"letra":"B","texto":"Apalancar la continuidad en la apropiación de los funcionarios de planta y la ciudadanía, evidenciando que el proyecto responde a una demanda pública legítima.","arquetipo":"Solucionador GovTech","rol":"Tejedor de sostenibilidad democrática"},{"letra":"C","texto":"Presentar a los nuevos directivos un balance técnico de desempeño del componente implementado para validar su continuidad con datos objetivos.","arquetipo":"Aliado Especializado","rol":"Demostrador de valor técnico"},{"letra":"D","texto":"Presentar rápidamente a los nuevos tomadores de decisión un resumen de resultados y aprendizajes para revalidar la pertinencia de la solución.","arquetipo":"Potencial GovTech","rol":"Reconector ágil de valor"}]}]`),f=s({answerSignature:()=>v,answerText:()=>O,archetypeDescriptions:()=>b,archetypes:()=>h,byId:()=>w,clean:()=>D,demo:()=>j,dims:()=>m,narratives:()=>x,phases:()=>p,profile:()=>k,questions:()=>C,resolveTie:()=>y,resultPlan:()=>A,tieOptions:()=>_,tieQuestion:()=>g,valid:()=>E,visible:()=>T}),p=[{id:`perfil`,name:`Conozcámonos`,label:`Perfil`,intro:`Tu organización, su aporte y su contexto. Esta información orienta el recorrido; no puntúa ni determina un arquetipo.`,scene:`perfil`},{id:`ser`,name:`Lo que nos mueve`,label:`SER`,intro:`Reconocemos el propósito que conecta a tu organización con una necesidad pública y el cambio que busca generar.`,scene:`f1`},{id:`hacer`,name:`Cómo lo hacemos`,label:`HACER`,intro:`Miramos cómo experimentan, colaboran y adaptan su forma de trabajar al contexto público.`,scene:`f2`},{id:`tener`,name:`Con qué contamos`,label:`TENER`,intro:`Describimos la tecnología, los recursos y las condiciones actuales para cumplir y dar continuidad a lo acordado.`,scene:`f3`}],m=[{id:`01`,name:`Propósito y valor público`,phase:`ser`,icon:`01`,desc:`Conectar la oferta con un problema público y un cambio observable para las personas.`,parts:[`Necesidad pública`,`Personas y contexto`,`Cambio esperado`,`Observación del valor`],next:`Precisar el problema, a quién afecta y cómo observar el cambio.`,evidence:`Ficha del problema, investigación con usuarios e indicadores pertinentes.`,badges:[`Brújula pública`]},{id:`02`,name:`Experimentación y colaboración`,phase:`hacer`,icon:`02`,desc:`Probar ideas y construir con otros, incorporando hallazgos y aportes en las decisiones.`,parts:[`Hipótesis y pruebas`,`Aprendizaje e iteración`,`Participación de usuarios`,`Acuerdos y decisiones compartidas`],next:`Diseñar una prueba y acordar con usuarios y aliados qué aprender y cómo decidir.`,evidence:`Plan de prueba, registros de hallazgos, acuerdos y cambios realizados.`,badges:[`Explorador de hipótesis`,`Articulador de alianzas`]},{id:`03`,name:`Preparación para lo público`,phase:`hacer`,icon:`06`,desc:`Entender el contexto institucional y adaptar la propuesta y la relación de trabajo al sector público.`,parts:[`Necesidades y actores`,`Condiciones de colaboración`,`Modelo de negocio y tiempos públicos`,`Alcance y acuerdos`],next:`Traducir la oferta a un caso público y reconocer qué ajustes necesita el modelo de trabajo.`,evidence:`Propuesta contextualizada, mapa de actores y acuerdos de alcance.`,badges:[`Navegante institucional`]},{id:`04`,name:`Tecnología responsable`,phase:`tener`,icon:`04`,desc:`Conocer qué hace la tecnología, cómo se integra y cómo protege los datos y los derechos de las personas.`,parts:[`Funcionamiento y límites`,`Integración con sistemas existentes`,`Datos, permisos y seguridad`,`Portabilidad y salida`],next:`Documentar una integración real o prevista, sus límites y el tratamiento de la información.`,evidence:`Demostración, arquitectura, pruebas de integración y controles de datos.`,badges:[`Estratega de tecnología`]},{id:`05`,name:`Recursos y continuidad`,phase:`tener`,icon:`07`,desc:`Contar con las condiciones operativas para entregar, sostener y transferir lo acordado.`,parts:[`Oferta y e puestas`,`No aplica`],[`C. Retos, pruebas o pilotos`,`No aplica`],[`D. Contratos directos`,`No aplica`],[`E. Participación mediante otra organización`,`No aplica`],[`F. Otra: ¿cuál?`,`No aplica`]]},{id:`C05`,fase:`Caracterización`,dimension:`Caracterización`,decision:`Se conserva`,razon:`Conservar, condicional: solo si C04 indica experiencia distinta de A. Selección única. Se mantiene el comentario opcional, no obligatorio.`,pregunta:`Pensando en su experiencia más reciente con una entidad pública, ¿cómo describiría el proceso?`,opciones:[[`A. Avanzó en términos generales como esperábamos`,`No aplica`],[`B. Avanzó, pero encontramos dificultades importantes`,`No aplica`],[`C. No avanzó o se interrumpió antes de lo esperado`,`No aplica`],[`D. Sigue en curso y aún es pronto para valorarlo`,`No aplica`],[`E. Prefiero no responder`,`No aplica`]]},{id:`C05 (seguimiento)`,fase:`Caracterización`,dimension:`Caracterización`,decision:`Se conserva`,razon:`Comentario opcional ya incluido en C05, visible solo cuando aplica la experiencia previa. No se cuenta como otra pregunta diagnóstica.`,pregunta:`¿Qué facilitó o dificultó el proceso? (opcional)`,opciones:[[`Respuesta abierta`,`No asigna arquetipo`]]},{id:`C06`,fase:`Caracterización`,dimension:`Caracterización`,decision:`Se conserva`,razon:`Conservar como opcional. Contextualiza tamaño; no equivale a capacidad demostrada ni suma al arquetipo.`,pregunta:`¿Cuántas personas trabajan actualmente de forma habitual en su organización, incluyéndose usted si participa en la operación?`,opciones:[[`A. Ninguna de forma habitual todavía`,`No aplica`],[`B. 1`,`No aplica`],[`C. 2 a 10`,`No aplica`],[`D. 11 a 50`,`No aplica`],[`E. 51 a 200`,`No aplica`],[`F. Más de 200`,`No aplica`],[`G. No sé / prefiero no responder`,`No aplica`]]},{id:`C07`,fase:`Caracterización`,dimension:`Caracterización`,decision:`Se conserva`,razon:`Conservar ambos campos como opcionales. Son campos de territorio, no dos alternativas excluyentes.`,pregunta:`¿Dónde opera su organización y en qué territorios le interesa trabajar?`,opciones:[[`A. Ciudad y país de operación: texto`,`No aplica`],[`B. Territorios de interés: selección múltiple o texto`,`No aplica`]]},{id:`C08`,fase:`Caracterización`,dimension:`Caracterización`,decision:`Se conserva`,razon:`Conservar como opcional en caracterización. Identifica expectativa antes de mostrar el resultado; no asigna arquetipo.`,pregunta:`¿Qué le gustaría obtener primero de este servicio?`,opciones:[[`A. Conocer mejor nuestro punto de partida GovTech`,`No aplica`],[`B. Entender cómo relacionarnos con entidades públicas`,`No aplica`],[`C. Fortalecer o probar nuestra oferta`,`No aplica`],[`D. Encontrar oportunidades de colaboración`,`No aplica`],[`E. Conocer cómo sustentar y obtener un reconocimiento`,`No aplica`],[`F. Aún no lo sabemos`,`No aplica`],[`G. Otra expectativa: ¿cuál?`,`No aplica`]]},{id:`P1`,fase:`SER`,dimension:`01 · Propósito y valor público`,decision:`Se conserva`,razon:`Conservar. Observa cómo aborda una necesidad pública antes de actuar. Complementa P2: abordaje y resultado no son equivalentes.`,pregunta:`Una secretaría distrital busca implementar una herramienta digital para atender la congestión ciudadana en la radicación presencial de un trámite prioritario. Ante este requerimiento, ¿cuál es el abordaje inicial de su equipo?`,opciones:[[`A. Mapear el flujo formal del procedimiento administrativo, las bases de datos de origen y el marco de competencias legales para estructurar una solución técnica jurídicamente viable.`,`Proveedor Tecnológico de Escala`],[`B. Realizar inmersiones etnográficas con usuarios y servidores de ventanilla para entender si la congestión es solo el síntoma de un proceso excluyente que requiere rediseño de fondo antes de automatizarse.`,`Solucionador GovTech`],[`C. Aportar metodologías de diagnóstico analítico o evaluación de experiencia de usuario para ayudar a la entidad a dimensionar con exactitud el cuello de botella técnico.`,`Aliado Especializado`],[`D. Proponer el despliegue rápido de una interfaz accesible que canalice de inmediato las solicitudes más repetitivas para descongestionar la atención ciudadana.`,`Potencial GovTech`]]},{id:`P2`,fase:`SER`,dimension:`01 · Propósito y valor público`,decision:`Se conserva`,razon:`Conservar. Observa qué evidencia de valor prioriza. Es la referencia principal para aplazar P0.4.`,pregunta:`Al evaluar si su intervención tecnológica generó un impacto positivo en la gestión pública, ¿qué evidencia prioriza su organización?`,opciones:[[`A. Ahorros fiscales verificados, reducción auditada de tiempos de ciclo y trazabilidad rigurosa de las operaciones administrativas del aparato público.`,`Proveedor Tecnológico de Escala`],[`B. Transformaciones observables en la calidad de vida de las comunidades, disminución de la fatiga burocrática y una mayor percepción ciudadana de dignidad y trato justo.`,`Solucionador GovTech`],[`C. La generación de métricas especializadas e indicadores de impacto técnico o sectorial que permitan auditar y comparar el desempeño de la solución frente al mercado.`,`Aliado Especializado`],[`D. El incremento en el número de ciudadanos que pudieron completar su trámite sin barreras y los testimonios directos de personas que resolvieron su necesidad.`,`Potencial GovTech`]]},{id:`P0.3`,fase:`HACER`,dimension:`02 · Experimentación y colaboración`,decision:`Se aplaza`,razon:`Solapamiento parcial. Ambas describen trabajo con funcionarios. P5 pide dinámicas concretas de coordinación y deja una señal más operativa. Se conservan: P5. Menor cobertura: Se reduce la lectura explícita de cómo la empresa concibe la relación, incluida la búsqueda de acompañamiento.`,pregunta:`En la cotidianidad de un proyecto con el sector público, ¿cómo concibe su organización la dinámica de trabajo con los funcionarios?`,opciones:[[`A. De supervisión formal y cumplimiento: nos ceñimos estrictamente al pliego contractual, a los hitos de entrega aprobados y a los acuerdos de servicio pactados.`,`Proveedor Tecnológico de Escala`],[`B. De colaboración horizontal: trabajamos en mesas mixtas de co-diseño con los servidores públicos, asumiendo conjuntamente las decisiones y ajustes del proyecto.`,`Solucionador GovTech`],[`C. De articulación técnica de nicho: interactuamos como especialistas en una mesa técnica interdisciplinaria, coordinando nuestro aporte con otras empresas o áreas.`,`Aliado Especializado`],[`D. De aprendizaje activo: buscamos acompañamiento institucional para entender la cultura pública y adaptar nuestras prácticas al ritmo del Estado.`,`Potencial GovTech`]]},{id:`P3`,fase:`HACER`,dimension:`02 · Experimentación y colaboración`,decision:`Se conserva`,razon:`Esta es muy importante`,pregunta:`Antes de comprometer recursos de desarrollo definitivos en un proyecto con la administración, ¿cuál es el mecanismo principal de su equipo para mitigar la incertidumbre?`,opciones:[[`A. Conducir pruebas de concepto técnicas (PoC) sobre arquitectura, integrabilidad con bases de datos heredadas y capacidad de carga en entornos protegidos.`,`Proveedor Tecnológico de Escala`],[`B. Diseñar un entorno de prueba controlado (sandbox) o desplegar un prototipo en una comunidad acotada para probar supuestos de uso en pocas semanas.`,`Solucionador GovTech`],[`C. Realizar pruebas de simulación especializada (auditorías técnicas, pruebas de usabilidad en laboratorio o ensayos de seguridad).`,`Aliado Especializado`],[`D. Poner a prueba versiones preliminares con usuarios voluntarios para observar cómo interactúan con la herramienta y recoger aprendizajes tempranos.`,`Potencial GovTech`]]},{id:`P4`,fase:`HACER`,dimension:`02 · Experimentación y colaboración`,decision:`Se conserva`,razon:`Conservar. Observa la respuesta ante evidencia inesperada en uso. Mantiene aprendizaje e iteración además de la prueba inicial.`,pregunta:`Durante un pilotaje en territorio, los datos de uso revelan que la ciudadanía utiliza la herramienta para un fin imprevisto y descarta la función que la entidad consideraba central. ¿Qué acción adopta su equipo?`,opciones:[[`A. Registrar el desvío en la bitácora técnica de configuración, evaluar impactos contractuales y solicitar autorización formal para redefinir el alcance pactado.`,`Proveedor Tecnológico de Escala`],[`B. Reconfigurar el flujo del sistema en el siguiente ciclo ágil para potenciar la función que los ciudadanos están demandando espontáneamente.`,`Solucionador GovTech`],[`C. Analizar los datos de navegación y proponer a la entidad un rediseño del componente técnico que reconcilie la necesidad del usuario con el objetivo misional.`,`Aliado Especializado`],[`D. Adaptar la interfaz de forma inmediata para acompañar el comportamiento espontáneo de los usuarios y documentar el aprendizaje para la entidad.`,`Potencial GovTech`]]},{id:`P5`,fase:`HACER`,dimension:`02 · Experimentación y colaboración`,decision:`Se conserva`,razon:`Conservar. Pregunta por mecanismos de trabajo conjunto, roles y acuerdos. Se prioriza sobre la descripción general de relación de P0.3. Mantiene una pregunta explícita de colaboración.`,pregunta:`Al convocar a servidores públicos de diferentes áreas para diseñar una solución conjunta, ¿cómo estructura su organización las dinámicas de trabajo?`,opciones:[[`A. Coordinando mesas técnicas periódicas con agendas estructuradas, matrices de responsabilidades (RACI) y actas de acuerdos trazables.`,`Proveedor Tecnológico de Escala`],[`B. Facilitando talleres horizontales inspirados en la Burocracia Creativa, donde se diluyen jerarquías y se co-diseña activamente como pares.`,`Solucionador GovTech`],[`C. Liderando sesiones de transferencia técnica especializada sobre nuestro componente para que los funcionarios comprendan cómo integrarlo en sus procesos.`,`Aliado Especializado`],[`D. Integrando a los funcionarios directamente en espacios informales y dinámicos de trabajo para probar y validar ideas de manera continua.`,`Potencial GovTech`]]},{id:`P6`,fase:`HACER`,dimension:`02 · Experimentación y colaboración`,decision:`Se aplaza`,razon:`Prioridad de tiempo, no duplicado. Se retienen orientación al problema, adaptación con evidencia y trabajo conjunto. El caso de discrepancia queda para profundizar. Se conservan: P1, P4 y P5. Menor cobertura: No se observa directamente la negociación entre directivos y usuarios. Las preguntas retenidas no sustituyen ese conflicto.`,pregunta:`Cuando surge una discrepancia entre lo que solicita la directiva de la entidad y las demandas expresadas por los usuarios de base en el territorio, ¿cuál es la postura de su equipo?`,opciones:[[`A. Convocar un comité técnico formal para mapear los requerimientos directivos frente al pliego contractual y las restricciones presupuestales.`,`Proveedor Tecnológico de Escala`],[`B. Presentar la evidencia viva y los testimonios de campo de forma asertiva para argumentar por qué el diseño debe responder al dolor ciudadano.`,`Solucionador GovTech`],[`C. Elaborar un informe técnico independiente que exponga los pros, contras y riesgos de cada alternativa para facilitar una decisión informada.`,`Aliado Especializado`],[`D. Proponer el diseño de dos alternativas funcionales ligeras para que una prueba rápida con usuarios permita resolver la divergencia con hechos.`,`Potencial GovTech`]]},{id:`P0.2`,fase:`HACER`,dimension:`03 · Preparación para lo público`,decision:`Se aplaza`,razon:`Solapamiento parcial. Repite la postura inicial frente a una necesidad incierta y la elección de un mecanismo para explorarla. Se conservan: P1 y P3. Menor cobertura: Menor detalle sobre cómo responde ante requerimientos públicos no definidos. Se mantiene conexión institucional en P15 y P16.`,pregunta:`Una secretaría distrital les plantea una necesidad comunitaria compleja que no tiene especificaciones técnicas cerradas. ¿Cuál es la postura inicial de su equipo?`,opciones:[[`A. Solicitamos a la entidad que termine de estructurar los términos de referencia y requerimientos funcionales para cotizar una solución cerrada y auditable.`,`Proveedor Tecnológico de Escala`],[`B. Desplegamos rápidamente un prototipo o experimento en campo con servidores y usuarios para reducir la incertidumbre paso a paso mediante datos de uso.`,`Solucionador GovTech`],[`C. Aportamos nuestro conocimiento experto y metodológico para investigar y calibrar la problemática, identificando qué componentes tecnológicos específicos se requieren.`,`Aliado Especializado`],[`D. Proponemos adaptar nuestra tecnología existente para ensayar una respuesta rápida y aprender cómo interactúa la ciudadanía con ella.`,`Potencial GovTech`]]},{id:`P0.4`,fase:`HACER`,dimension:`03 · Preparación para lo público`,decision:`Se aplaza`,razon:`Solapamiento alto. Ambas preguntan qué resultado o evidencia se considera éxito. Se prioriza P2 como lectura de valor público. Se conservan: P2. Menor cobertura: Menos información sobre éxito contractual, tracción y transferencia al cierre. P2 no cubre cada uno de esos matices.`,pregunta:`Al finalizar una intervención con una entidad pública, ¿qué resultado demuestra que el trabajo de su organización fue exitoso?`,opciones:[[`A. La entrega a conformidad del sistema contratado, el cumplimiento de cronogramas y estándares de rendimiento, y el cobro regular del servicio.`,`Proveedor Tecnológico de Escala`],[`B. La transformación cualitativa en el bienestar ciudadano, la transferencia de capacidades al equipo estatal y la validación de valor público en territorio.`,`Solucionador GovTech`],[`C. La resolución efectiva de un cuello de botella técnico complejo y la generación de evidencia o conocimiento aplicable para el ecosistema.`,`Aliado Especializado`],[`D. La validación de que nuestra tecnología funciona en el entorno público y la apertura de una hoja de ruta para continuar colaborando con la ciudad.`,`Potencial GovTech`]]},{id:`P15`,fase:`HACER`,dimension:`03 · Preparación para lo público`,decision:`Se conserva`,razon:`Conservar. Aporta la dimensión financiera del trabajo público. Relación transversal con Recursos y continuidad; se mantiene en HACER según v10. El supuesto de 60–120 días… ESTA NO SE SI LA PODEMOS DEJAR DANI PERO MAS LITE`,pregunta:`En la contratación distrital, los desembolsos suelen demorar entre 60 y 120 días por trámites de supervisión y programación de pagos (PAC). ¿Cómo sostiene su empresa la operación ante este desfase financiero?`,opciones:[[`A. Contamos con respaldo financiero y flujo de caja planificado para absorber ciclos largos de facturación sin detener el servicio ni comprometer al equipo.`,`Proveedor Tecnológico de Escala`],[`B. Gestionamos esquemas de compra pública ágil estructurados por hitos cortos de entrega y validación, mitigando la exposición de caja mediante acuerdos de pago escalonados.`,`Solucionador GovTech`],[`C. Operamos en consorcio o alianza con empresas ancla que respaldan la liquidez financiera mientras aportamos nuestro componente tecnológico.`,`Aliado Especializado`],[`D. Requerimos acompañamiento y orientación para acceder a figuras contractuales adaptadas a startups (como convenios de ciencia y tecnología o anticipos de pilotaje).`,`Potencial GovTech`]]},{id:`P16`,fase:`HACER`,dimension:`03 · Preparación para lo público`,decision:`Se conserva`,razon:`Conservar. Observa respuesta ante un relevo institucional. No es igual a una caída técnica de P13.`,pregunta:`Durante la ejecución de una iniciativa ocurre un relevo repentino en el equipo directivo de la secretaría contratante. ¿Cuál es la estrategia de su equipo para salvaguardar la continuidad del proyecto?`,opciones:[[`A. Respaldar el proceso en la trazabilidad formal de los entregables aprobados, las actas de supervisión vigentes y las obligaciones contractuales consolidadas.`,`Proveedor Tecnológico de Escala`],[`B. Apalancar la continuidad en la apropiación de los funcionarios de planta y la ciudadanía, evidenciando que el proyecto responde a una demanda pública legítima.`,`Solucionador GovTech`],[`C. Presentar a los nuevos directivos un balance técnico de desempeño del componente implementado para validar su continuidad con datos objetivos.`,`Aliado Especializado`],[`D. Presentar rápidamente a los nuevos tomadores de decisión un resumen de resultados y aprendizajes para revalidar la pertinencia de la solución.`,`Potencial GovTech`]]},{id:`P0.1`,fase:`TENER`,dimension:`05 · Recursos y continuidad`,decision:`Se conserva`,razon:`Conservar. Precisa qué pone a disposición la organización. C02 identifica un rol amplio; esta pregunta distingue oferta lista, desarrollo, componente y oferta emergente.`,pregunta:`Cuando una entidad pública acude a su organización buscando modernizar un servicio, ¿cuál es el producto principal que ustedes ponen a disposición?`,opciones:[[`A. Una solución empaquetada, probada y lista para implementar (off-the-shelf o SaaS propietario), con alcances técnicos y garantías industriales cerradas desde el primer día.`,`Proveedor Tecnológico de Escala`],[`B. Una capacidad de desarrollo ágil e iterativo para construir, adaptar y pilotar una solución tecnológica a la medida del dolor y contexto de esa entidad.`,`Solucionador GovTech`],[`C. Un componente tecnológico especializado (algoritmo específico, módulo de ciberseguridad, analítica avanzada) o un estudio técnico que complementa una solución mayor.`,`Aliado Especializado`],[`D. Una herramienta o desarrollo emergente de base tecnológica que busca su primera oportunidad para probar su aplicabilidad en un reto de ciudad.`,`Potencial GovTech`]]},{id:`P7`,fase:`TENER`,dimension:`04 · Tecnología responsable`,decision:`Se conserva`,razon:`Conservar. Integración con sistemas existentes. No equivale a funcionamiento interno ni a protección de datos.`,pregunta:`Cuando su solución debe operar con bases de datos fragmentadas o sistemas informáticos heredados (legacy systems) de la entidad pública, ¿cuál es su enfoque de integración técnica?`,opciones:[[`A. Exigimos la parametrización de conectores estandarizados de grado corporativo o recomendamos migrar los datos a nuestra infraestructura certificada en la nube.`,`Proveedor Tecnológico de Escala`],[`B. Desplegamos capas intermedias (middleware) modulares y APIs seguras que extraen y sincronizan datos sin requerir que la entidad modifique o sustituya sus servidores centrales.`,`Solucionador GovTech`],[`C. Desarrollamos scripts y conectores específicos a medida para enlazar nuestro componente analítico con las bases heredadas de la entidad previa auditoría técnica.`,`Aliado Especializado`],[`D. Diseñamos mecanismos sencillos de importación/exportación periódica de datos estructurados para operar de forma desacoplada sin generar traumatismos técnicos.`,`Potencial GovTech`]]},{id:`P8`,fase:`TENER`,dimension:`04 · Tecnología responsable`,decision:`Se conserva`,razon:`Conservar. Examina cómo declara demostrar solidez técnica. Se conserva literal, aunque el contraste con “prototipo superficial” y sus alternativas requiere validación de comprensión.`,pregunta:`Frente al auge de herramientas automáticas (wrappers de IA y plataformas no-code), ¿cómo demuestra su equipo que su tecnología cuenta con solidez de ingeniería y no es un prototipo superficial?`,opciones:[[`A. Respaldamos nuestra tecnología en plataformas industriales licenciadas con soporte de clase mundial, acuerdos de servicio blindados y certificaciones ISO de desarrollo.`,`Proveedor Tecnológico de Escala`],[`B. Disponemos de repositorio de código propio con trazabilidad (commits), arquitectura documentada, pruebas automatizadas y gobierno estricto sobre el ciclo de vida del software.`,`Solucionador GovTech`],[`C. Documentamos con rigor científico los modelos algorítmicos, las fuentes de entrenamiento y los límites de precisión técnica de nuestro componente especializado.`,`Aliado Especializado`],[`D. Mostramos una interfaz funcional y probada que resuelve con éxito el flujo de interacción, respaldada por un equipo que puede ajustar el código ante fallos de uso.`,`Potencial GovTech`]]},{id:`P9`,fase:`TENER`,dimension:`04 · Tecnología responsable`,decision:`Se conserva`,razon:`Conservar. Mantiene tratamiento de datos y responsabilidad. Las prácticas pueden coexistir; la elección no prueba ausencia de las demás.`,pregunta:`Respecto al tratamiento de datos personales de la ciudadanía y la gobernanza de la información pública, ¿cuál es la práctica de su organización?`,opciones:[[`A. Implementar controles formales de seguridad de la información (cifrado avanzado, trazabilidad de logs inmutables y cumplimiento estricto del régimen de datos).`,`Proveedor Tecnológico de Escala`],[`B. Explicar en lenguaje transparente y accesible qué datos se recolectan y para qué fines, facilitando la auditoría social y el control ciudadano sobre el código.`,`Solucionador GovTech`],[`C. Aplicar protocolos especializados de anonimización de datos y revisión de sesgos en algoritmos para salvaguardar la neutralidad del sistema.`,`Aliado Especializado`],[`D. Adoptar una política estricta de minimización: capturar exclusivamente los datos indispensables para que el servicio opere, evitando almacenar información sensible.`,`Potencial GovTech`]]},{id:`P10`,fase:`TENER`,dimension:`04 · Tecnología responsable`,decision:`Se conserva`,razon:`Conservar. Mantiene condiciones de salida, portabilidad y dependencia. No se sustituye con soporte o respuesta ante fallos.`,pregunta:`Si la administración pública resuelve terminar la relación comercial con su empresa, ¿qué condiciones contractuales y técnicas rigen la salida del servicio?`,opciones:[[`A. El código y la infraestructura permanecen como propiedad exclusiva de nuestra empresa, pero entregamos la totalidad de las bases de datos exportadas según el acuerdo de servicio.`,`Proveedor Tecnológico de Escala`],[`B. Garantizamos un costo de salida estipulado cercano a cero, entregando los datos en formatos abiertos universales y facilitando la migración del código sin penalidades técnicas.`,`Solucionador GovTech`],[`C. Transferimos la titularidad de las parametrizaciones y la documentación metodológica desarrollada a medida para que otro operador pueda continuar la labor.`,`Aliado Especializado`],[`D. Ponemos a disposición de la entidad la totalidad del código y los datos generados bajo esquemas abiertos para que la administración los gestione con total autonomía.`,`Potencial GovTech`]]},{id:`P11`,fase:`TENER`,dimension:`05 · Recursos y continuidad`,decision:`Se conserva`,razon:`Conservar. Observa soporte tras el despliegue, distinto de la primera respuesta a un incidente de P13.`,pregunta:`Para asegurar que una solución tecnológica mantenga su estabilidad operativa tras el despliegue inicial, ¿cuál es la estrategia de soporte de su organización?`,opciones:[[`A. Establecer Acuerdos de Nivel de Servicio (SLA) exhaustivos, esquemas estructurados de mesa de ayuda y manuales de arquitectura y soporte técnico 24/7.`,`Proveedor Tecnológico de Escala`],[`B. Dejar habilitados canales continuos de retroalimentación de usuario y un catálogo priorizado de mejoras (backlog) para iterar la herramienta según nuevos requerimientos.`,`Solucionador GovTech`],[`C. Ofrecer soporte técnico de segundo y tercer nivel focalizado exclusivamente en el mantenimiento y actualización de nuestro componente tecnológico.`,`Aliado Especializado`],[`D. Brindar acompañamiento directo y cercano a los servidores que operan la herramienta durante las primeras semanas, respondiendo con agilidad ante cualquier duda.`,`Potencial GovTech`]]},{id:`P12`,fase:`TENER`,dimension:`05 · Recursos y continuidad`,decision:`Se aplaza`,razon:`Prioridad de tiempo, no duplicado. Se conservan salida y soporte. La pregunta dedicada a transferencia se aplaza para el recorrido completo. Se conservan: P10 y P11, cobertura parcial. Menor cobertura: La autonomía y formación del equipo público quedan menos observadas. No inferir transferencia de capacidades a partir de soporte.`,pregunta:`En concordancia con el principio de evitar la atrofia del sector público planteado por Mariana Mazzucato, ¿cómo transfiere su equipo capacidades a los servidores del Distrito?`,opciones:[[`A. Impartir capacitaciones formales de administración del sistema y entregar manuales de operación detallados para certificar a los operadores públicos.`,`Proveedor Tecnológico de Escala`],[`B. Acompañar a los funcionarios mediante mentorías de «aprender haciendo» y entrega de código comentado, para que sean autónomos en la evolución del software.`,`Solucionador GovTech`],[`C. Entrenar a los equipos técnicos del Distrito en los principios de operación y mantenimiento de nuestra tecnología especializada.`,`Aliado Especializado`],[`D. Documentar paso a paso la configuración de la herramienta y realizar talleres prácticos para que los equipos públicos puedan gestionarla por sí mismos.`,`Potencial GovTech`]]},{id:`P13`,fase:`TENER`,dimension:`05 · Recursos y continuidad`,decision:`Se conserva`,razon:`Conservar. Mantiene contingencia y respuesta a una interrupción del servicio. No demuestra por sí sola capacidad real de recuperación.`,pregunta:`Ocurre una interrupción imprevista del servicio digital en un trámite masivo de la ciudad. ¿Cuál es la primera línea de acción de su equipo técnico?`,opciones:[[`A. Activar el protocolo formal de continuidad de negocio, aislar la falla en los logs de auditoría y generar el reporte circunstanciado para la supervisión.`,`Proveedor Tecnológico de Escala`],[`B. Desplegar una contingencia técnica de respuesta inmediata para restablecer la disponibilidad funcional en minutos, informando con transparencia a la ciudadanía.`,`Solucionador GovTech`],[`C. Diagnosticar si el fallo se originó en nuestro componente o en un sistema externo, aplicando los parches de remediación correspondientes.`,`Aliado Especializado`],[`D. Activar de inmediato mecanismos alternativos de emergencia para que la ciudadanía pueda seguir gestionando su trámite mientras se soluciona el código.`,`Potencial GovTech`]]},{id:`P14`,fase:`TENER`,dimension:`05 · Recursos y continuidad`,decision:`Se aplaza`,razon:`Solapamiento parcial y prioridad. Se conservan adaptación por hallazgos, interrupción técnica y cambio institucional; se aplaza un cuarto escenario de cambio. Se conservan: P4, P13 y P16. Menor cobertura: No se evalúa directamente la adaptación regulatoria o a una emergencia local. Mantenerla para profundización.`,pregunta:`Durante la ejecución del proyecto se aprueba una nueva directriz regulatoria o sobreviene una emergencia local que altera las condiciones pactadas. ¿Cómo responde su organización?`,opciones:[[`A. Revisar la matriz contractual de riesgos para calcular los impactos en plazos y costos, tramitando las modificaciones formales ante la supervisión.`,`Proveedor Tecnológico de Escala`],[`B. Reajustar la planificación y los módulos de desarrollo de manera ágil para responder a la nueva realidad sin frenar el proyecto.`,`Solucionador GovTech`],[`C. Evaluar cómo la nueva regulación afecta los estándares técnicos de nuestra solución y proponer los ajustes requeridos para cumplir la norma.`,`Aliado Especializado`],[`D. Adaptar las funcionalidades de la herramienta de manera flexible para que la entidad pueda atender la contingencia sin traumatismos.`,`Potencial GovTech`]]},{id:`DESEMPATE`,fase:`Cierre condicional`,dimension:`Perfil de arquetipo`,decision:`Se conserva`,razon:`Solo si hay empate y solo con las opciones de los arquetipos empatados. No cuenta entre las 14 preguntas del ADN.`,pregunta:`Ante un reto de una entidad pública, ¿cuál sería el aporte principal de tu organización?`,opciones:[[`A. Adaptar e implementar una solución tecnológica que ya tenemos.`,`Proveedor Tecnológico de Escala`],[`B. Explorar el reto con la entidad y probar una solución conjuntamente.`,`Solucionador GovTech`],[`C. Aportar conocimiento o un servicio especializado junto con otros aliados.`,`Aliado Especializado`],[`D. Definir cómo podríamos contribuir y preparar una primera prueba.`,`Potencial GovTech`]]}]},{phases:N,dims:P,archet
